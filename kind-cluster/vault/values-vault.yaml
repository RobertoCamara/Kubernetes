global:
  enabled: true

injector:
  enabled: false

server:
  enabled: true
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address = "0.0.0.0:8200"
        tls_disable = 1
      }

      storage "file" {
        path = "/vault/data"
      }
  dataStorage:
    enabled: false
  service:
    enabled: true
    type: NodePort
    port: 8200
    targetPort: 8200
    nodePort: 30200
  volumes:
    - name: vault-data
      hostPath:
        path: /var/lib/kind-data/vault
        type: DirectoryOrCreate
  volumeMounts:
    - name: vault-data
      mountPath: /vault/data

ui:
  enabled: true
